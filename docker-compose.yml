services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bd_lojab
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  api:
    build: ./api
    ports: ["8000:8000"]

  mosquitto:          # broker MQTT (porta 1883)
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  nodered:            # dashboard em http://localhost:1880/ui
    build: ./docker/nodered
    ports: ["1880:1880"]
    depends_on: [mosquitto]
    volumes:
      - ./output:/output:ro

  kettle:             # corre com: docker compose run --rm kettle
    build: ./docker/kettle
    profiles: ["job"]
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_started }
    volumes:
      - .:/project
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_ORIGEM: ${EMAIL_ORIGEM}
      EMAIL_DESTINO: ${EMAIL_DESTINO}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

volumes:
  dbdata:
  mqttdata:
